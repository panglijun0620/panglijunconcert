spring:
  application:
    name: concert-analytics-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names: dashboard,market,sentiment,recommendations,data-quality,concert-calendar,ai-insight
    redis:
      time-to-live: 12h
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:1s}
      repositories:
        enabled: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # 大屏接口里 market 单次返回 182 KB 明文，开压缩后传输量明显下降
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
  endpoint:
    health:
      show-details: never

concert:
  security:
    admin:
      enabled: ${ADMIN_API_ENABLED:false}
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:}
    viewer:
      username: ${VIEWER_USERNAME:viewer}
      password: ${VIEWER_PASSWORD:}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # 风险对象解读：密钥只从环境变量读，代码和仓库里不出现；默认关闭，关闭时全部走模板
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${AI_MODEL:qwen-plus}
    api-key: ${AI_API_KEY:}
    connect-timeout-millis: ${AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-millis: ${AI_READ_TIMEOUT_MS:6000}
    max-tokens: ${AI_MAX_TOKENS:320}
    temperature: ${AI_TEMPERATURE:0.3}

info:
  app:
    name: ${spring.application.name}
    java-version: ${java.version}
