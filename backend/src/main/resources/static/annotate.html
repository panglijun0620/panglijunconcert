<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f8f6">
    <title>PULSE ATLAS / 情感标注</title>
    <style>
        :root {
            --ink: #10231b;
            --muted: #5d7268;
            --line: #d7e3dc;
            --card: #ffffff;
            --accent: #16795a;
            --accent-soft: #e6f4ee;
            --pos: #1a7f5a;
            --neu: #6b7280;
            --neg: #b03a2e;
            --bg: #f2f6f3;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at 12% 8%, #e3f0e9 0, transparent 45%), var(--bg);
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            color: var(--ink);
        }

        .shell { width: min(680px, 100%); margin: 0 auto; }

        .top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 6px;
        }

        .brand {
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .counter { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }

        .bar {
            height: 4px;
            margin: 10px 0 22px;
            background: var(--line);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 26px 24px;
            box-shadow: 0 16px 40px rgba(16, 35, 27, .07);
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 12px;
            color: var(--muted);
        }

        .chip {
            padding: 3px 9px;
            background: var(--accent-soft);
            border-radius: 999px;
            color: var(--accent);
        }

        .text {
            margin: 0 0 26px;
            font-size: 17px;
            line-height: 1.85;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

        .actions button {
            padding: 14px 8px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            transition: filter .15s, transform .1s;
        }

        .actions button:active { transform: scale(.98); }
        .actions button:hover { filter: brightness(1.08); }
        .btn-pos { background: var(--pos); }
        .btn-neu { background: var(--neu); }
        .btn-neg { background: var(--neg); }

        .foot {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted);
        }

        .link-button {
            padding: 7px 12px;
            font-size: 13px;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }

        .link-button:hover { color: var(--accent); border-color: var(--accent); }

        .report { margin-top: 22px; }
        .report h2 { margin: 0 0 12px; font-size: 18px; }
        .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }

        .stat {
            padding: 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .stat span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .stat strong { font-size: 22px; font-variant-numeric: tabular-nums; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); }
        th, td { padding: 9px 10px; border: 1px solid var(--line); text-align: center; }
        th { background: var(--accent-soft); font-weight: 600; }

        .hint { margin: 16px 0 0; font-size: 12.5px; line-height: 1.75; color: var(--muted); }

        .loading { padding: 40px; text-align: center; color: var(--muted); }

        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .text { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="shell">
    <div class="top">
        <span class="brand">PULSE / ATLAS · 情感标注</span>
        <span class="counter" id="counter">正在读取样本…</span>
    </div>
    <div class="bar"><i id="bar-fill"></i></div>

    <div id="workspace">
        <div class="card loading" id="loading">正在从数据库抽取样本…</div>
    </div>

    <div class="foot">
        <span id="hint-text">看完一条点一个按钮，自动进入下一条</span>
        <span>
            <button class="link-button" type="button" id="undo">上一条</button>
            <button class="link-button" type="button" id="export">导出结果</button>
            <button class="link-button" type="button" id="reset">重来</button>
        </span>
    </div>

    <section class="report" id="report" hidden></section>
</div>

<script>
(() => {
    'use strict';

    const STORAGE_KEY = 'pa-annotation-v1';
    const LABELS = { positive: '正面', neutral: '中性', negative: '负面' };
    const ORDER = ['positive', 'neutral', 'negative'];

    let samples = [];
    let answers = {};

    const $ = (selector) => document.querySelector(selector);
    const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));

    const loadAnswers = () => {
        try { answers = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch (_) { answers = {}; }
    };

    const saveAnswers = () => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch (_) { /* 无痕模式忽略 */ }
    };

    const currentIndex = () => samples.findIndex((item) => answers[item.id] === undefined);

    const render = () => {
        const index = currentIndex();
        const done = samples.filter((item) => answers[item.id] !== undefined).length;
        $('#counter').textContent = samples.length ? `已完成 ${done} / ${samples.length}` : '暂无样本';
        $('#bar-fill').style.width = samples.length ? `${(done / samples.length) * 100}%` : '0';

        if (index < 0) {
            $('#workspace').innerHTML = '<div class="card loading">全部标完了，下面是对比结果。</div>';
            renderReport();
            return;
        }
        $('#report').hidden = true;
        const item = samples[index];
        $('#workspace').innerHTML = `
            <div class="card">
                <div class="meta">
                    <span class="chip">${escapeHTML(item.artist || '未知艺人')}</span>
                    <span class="chip">${escapeHTML(item.topic || '未分类')}</span>
                    <span>第 ${index + 1} 条 / 共 ${samples.length} 条</span>
                </div>
                <p class="text">${escapeHTML(item.text)}</p>
                <div class="actions">
                    <button class="btn-pos" type="button" data-label="positive">正面</button>
                    <button class="btn-neu" type="button" data-label="neutral">中性</button>
                    <button class="btn-neg" type="button" data-label="negative">负面</button>
                </div>
            </div>`;
    };

    const answer = (label) => {
        const index = currentIndex();
        if (index < 0) return;
        answers[samples[index].id] = label;
        saveAnswers();
        render();
    };

    // 「上一条」必须相对于当前看到的位置往回退一条。
    // 不能直接删"数组里最后一条已标的"：标注进度跨批次延续时，已标的号可能分布在后面的段落里，
    // 删那条只会让进度条数字变小，眼前这条评论一动都不动。
    const undo = () => {
        const index = currentIndex();
        for (let i = (index < 0 ? samples.length : index) - 1; i >= 0; i -= 1) {
            if (answers[samples[i].id] !== undefined) {
                delete answers[samples[i].id];
                saveAnswers();
                render();
                return;
            }
        }
    };

    const metrics = () => {
        const labeled = samples.filter((item) => answers[item.id] !== undefined);
        const matrix = { positive: { positive: 0, neutral: 0, negative: 0 },
                         neutral: { positive: 0, neutral: 0, negative: 0 },
                         negative: { positive: 0, neutral: 0, negative: 0 } };
        let correct = 0;
        labeled.forEach((item) => {
            const human = answers[item.id];
            const rule = item.ruleLabel;
            if (matrix[human] && matrix[human][rule] !== undefined) matrix[human][rule] += 1;
            if (human === rule) correct += 1;
        });
        const perClass = ORDER.map((label) => {
            const tp = matrix[label][label];
            const predicted = ORDER.reduce((sum, human) => sum + matrix[human][label], 0);
            const actual = ORDER.reduce((sum, rule) => sum + matrix[label][rule], 0);
            const precision = predicted ? tp / predicted : 0;
            const recall = actual ? tp / actual : 0;
            const f1 = (precision + recall) ? (2 * precision * recall) / (precision + recall) : 0;
            return { label, tp, predicted, actual, precision, recall, f1 };
        });
        return {
            total: labeled.length,
            accuracy: labeled.length ? correct / labeled.length : 0,
            macroF1: perClass.reduce((sum, row) => sum + row.f1, 0) / perClass.length,
            perClass,
            matrix,
        };
    };

    const percent = (value) => `${(value * 100).toFixed(1)}%`;

    const renderReport = () => {
        const m = metrics();
        const rows = m.perClass.map((row) => `
            <tr>
                <td>${LABELS[row.label]}</td>
                <td>${row.actual}</td>
                <td>${row.tp}</td>
                <td>${percent(row.precision)}</td>
                <td>${percent(row.recall)}</td>
                <td>${percent(row.f1)}</td>
            </tr>`).join('');
        const matrixRows = ORDER.map((human) => `
            <tr>
                <th>${LABELS[human]}</th>
                ${ORDER.map((rule) => `<td>${m.matrix[human][rule]}</td>`).join('')}
            </tr>`).join('');

        $('#report').hidden = false;
        $('#report').innerHTML = `
            <h2>对比结果</h2>
            <div class="report-grid">
                <div class="stat"><span>标注样本</span><strong>${m.total}</strong></div>
                <div class="stat"><span>准确率</span><strong>${percent(m.accuracy)}</strong></div>
                <div class="stat"><span>宏平均 F1</span><strong>${percent(m.macroF1)}</strong></div>
            </div>
            <table>
                <thead><tr><th>类别</th><th>人工标注数</th><th>判对</th><th>精确率</th><th>召回率</th><th>F1</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
            <h2 style="margin-top:22px">混淆矩阵</h2>
            <table>
                <thead><tr><th>人工 \\ 规则</th>${ORDER.map((label) => `<th>${LABELS[label]}</th>`).join('')}</tr></thead>
                <tbody>${matrixRows}</tbody>
            </table>
            <p class="hint">对角线上的数字是判对的条数。准确率是整体判对比例；F1 按类别分别算再取平均，能避免“全判正面”这类取巧做法虚高。</p>`;
    };

    const exportCsv = () => {
        const rows = [['评论ID', '正文', '人工标注', '规则判定', '规则分值', '艺人', '话题']];
        samples.forEach((item) => {
            const human = answers[item.id];
            if (!human) return;
            rows.push([
                item.id,
                item.text,
                LABELS[human],
                LABELS[item.ruleLabel] || item.ruleLabel,
                item.score ?? '',
                item.artist || '',
                item.topic || '',
            ]);
        });
        if (rows.length === 1) {
            window.alert('还没有标注任何样本');
            return;
        }
        const csv = rows.map((row) => row.map((cell) => {
            const text = String(cell);
            return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        }).join(',')).join('\r\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = '情感标注结果.csv';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
    };

    document.addEventListener('click', (event) => {
        const button = event.target.closest('[data-label]');
        if (button) { answer(button.dataset.label); return; }
        if (event.target.closest('#undo')) undo();
        if (event.target.closest('#export')) exportCsv();
        if (event.target.closest('#reset')) {
            if (window.confirm('清空已标注的记录，重新开始？')) {
                answers = {};
                saveAnswers();
                render();
            }
        }
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === '1') answer('positive');
        if (event.key === '2') answer('neutral');
        if (event.key === '3') answer('negative');
        if (event.key === 'Backspace') { event.preventDefault(); undo(); }
    });

    const start = async () => {
        loadAnswers();
        try {
            // 每类抽多少条，默认 100（共 300 条），可用地址栏 ?n=40 调整，后端上限每类 120。
            const requested = Number(new URLSearchParams(location.search).get('n')) || 100;
            const sampleSize = Math.min(120, Math.max(5, requested));
            const response = await fetch(`/api/v1/eval/samples?perClass=${sampleSize}`);
            if (!response.ok) throw new Error(`抽样接口返回 ${response.status}`);
            const payload = await response.json();
            samples = payload.samples || [];
            if (!samples.length) {
                $('#workspace').innerHTML = '<div class="card loading">没有取到样本，请先确认数据库里有评论数据。</div>';
                return;
            }
            render();
        } catch (error) {
            $('#workspace').innerHTML = `<div class="card loading">读取失败：${escapeHTML(error.message)}</div>`;
        }
    };

    start();
})();
</script>
</body>
</html>
