spark.master                     yarn
spark.submit.deployMode          client
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs:///spark-events
spark.dynamicAllocation.enabled  false
spark.executor.instances         2
spark.executor.cores             1
spark.executor.memory            768m
spark.executor.memoryOverhead    384m
spark.driver.memory              768m
spark.sql.shuffle.partitions     8
spark.default.parallelism        4
spark.yarn.maxAppAttempts        1
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version 2
spark.driver.extraJavaOptions    --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
spark.executor.extraJavaOptions  --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
